# AOIA source registry v4 - FINE ARTS ONLY  (generated 2026-10-12)
# - sources:               every entry has base_url. enabled:false = kept but not crawled for ranked opportunities.
# - unresolved_sources:    in your list but no official URL could be confirmed. The app must resolve each via
#                          `discovery_queries`, run the health gate, then PROMOTE it to `sources` (never guess a URL).
# - geo_basis: registry -> organiser's own site, geo may fall back to country/city here.
#              text     -> directories / media: the item's OWN text decides geo (else UNKNOWN, never INTERNATIONAL).
# - channel_role: organiser | funder | venue (gallery) | sales (marketplace/auction) | discovery (directory/media)
# - career_level (beginner|intermediate|standard) = suitability tier from your list; *_confidence low where the
#   pasted table was misaligned.  origin: user_doc | user_list | web_search_seen | assistant_candidate.
# - verification stays PENDING until the health gate runs (nothing here was live-fetched).
defaults:
  crawl_depth: 2
  max_pages_per_source: 60
  per_domain_delay_seconds: 2
  anchor_vocab:
    [
      open call,
      call for entries,
      call for applications,
      apply,
      application,
      residency,
      fellowship,
      scholarship,
      grant,
      financial assistance,
      award,
      prize,
      competition,
      commission,
      exhibition,
      notice,
      announcement,
      circular,
      entries invited,
      regional centre,
      submission,
    ]
  anchor_vocab_negative:
    [
      about,
      contact,
      login,
      admin,
      sitemap,
      gallery,
      library,
      publication,
      tender,
      recruitment,
      rti,
      shop,
      donate,
      sale,
      auction,
    ]
medium_filter:
  include:
    - painting
    - drawing
    - sculpture
    - printmaking
    - print making
    - ceramics
    - ceramic
    - installation
    - mixed media
    - textile art
    - fibre art
    - mural
    - public art
    - contemporary art
    - visual art
    - fine art
    - collage
    - assemblage
    - video art
  exclude:
    - photography
    - photo
    - photographer
    - photobook
    - film
    - cinema
    - documentary
    - music
    - dance
    - theatre
    - theater
    - drama
    - literature
    - poetry
    - fashion
    - graphic design
    - architecture
    - animation
  rule:
    keep a record if it matches >=1 include term AND is not exclusively matched by exclude terms; photography-only calls are dropped; multi-disciplinary
    calls that name a fine-arts medium are kept.
